name: APK Android

on:
  push:
    branches: [main]
    paths: ['www/**', 'assets/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write # para publicar la APK como Release (enlace de descarga directo)

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Generar proyecto Android
        run: |
          npx cap add android
          npm run iconos -- --android
          npx cap sync android

      # Si existen los secretos de firma → APK release firmada (se puede actualizar sin desinstalar).
      # Si no → APK debug (sirve para probar; al actualizar puede pedir desinstalar la anterior).
      - name: Compilar APK
        working-directory: android
        env:
          KS_B64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/visor.jks"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/visor.jks" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            cp app/build/outputs/apk/release/app-release.apk ../VisorDeCambios.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../VisorDeCambios.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: VisorDeCambios-apk
          path: VisorDeCambios.apk

      - name: Publicar Release (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Visor de Cambios · build ${{ github.run_number }}
          files: VisorDeCambios.apk
          make_latest: true
